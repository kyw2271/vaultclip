<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VaultClip</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="heading">
      <h1>VaultClip</h1>
      <label class="language-field">
        <span data-i18n="languageLabel">언어</span>
        <select id="language" disabled>
          <option value="auto" data-i18n="languageAuto">Chrome 언어에 맞춤</option>
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
      </label>
    </header>
    <div class="version" data-i18n="subtitle">Markdown 요약 + PDF 아카이브</div>

    <section class="panel">
      <div class="row">
        <button id="pickVault" data-i18n="pickVault" disabled>Vault 폴더 선택</button>
        <span id="vaultStatus" class="badge bad" data-i18n="vaultNotSelected">미선택</span>
      </div>

      <label class="field">
        <span data-i18n="subfolderLabel">Vault 내부 저장 폴더</span>
        <input id="subfolder" type="text" value="WebClip" spellcheck="false">
      </label>

      <label class="field">
        <span data-i18n="summaryLengthLabel">요약 최대 길이</span>
        <select id="summaryChars">
          <option value="500" data-i18n="summaryShort">짧게 · 약 500자</option>
          <option value="900" selected data-i18n="summaryMedium">보통 · 약 900자</option>
          <option value="1500" data-i18n="summaryLong">길게 · 약 1,500자</option>
        </select>
      </label>

      <label class="check">
        <input id="embedPdf" type="checkbox" checked>
        <span><span data-i18n="embedPdfLabel">PDF를 노트 안에 임베드</span> <code>![[...]]</code></span>
      </label>
    </section>

    <section class="notice">
      <strong data-i18n="pdfPermissionTitle">PDF 자동 저장 권한 안내</strong>
      <p data-i18n="pdfPermissionBody">PDF 생성 시 현재 탭에 Chrome 디버깅 인터페이스를 잠시 연결합니다.
      페이지 데이터는 외부 서버로 전송하지 않으며 PDF 저장 직후 연결을 해제합니다.</p>
    </section>

    <button id="saveBoth" class="primary" data-i18n="saveBoth" disabled>요약 MD + PDF 저장</button>
    <p id="status" role="status" aria-live="polite" data-i18n="selectVaultFirst">Vault를 먼저 선택하세요.</p>
    <p class="hint" data-i18n="noteHint">MD에는 저장 시간·요약·PDF 연결만 기록합니다. 원문 전문은 PDF에만 보존합니다.</p>
  </main>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
